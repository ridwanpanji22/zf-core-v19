services:
  backend:
    image: ghcr.io/ridwanpanji22/zf-core-v19/backend:latest
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000" # Internal only — reverse proxy via OpenLiteSpeed
    dns:
      - 172.30.0.53 # CoreDNS DoT sidecar (bypasses ISP/Kominfo UDP/53 hijack)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dns:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped
    networks: [frontend, backend, data]
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    image: ghcr.io/ridwanpanji22/zf-core-v19/backend:latest
    build: ./backend
    command: celery -A app.services.celery_app worker --loglevel=info --pool=prefork --concurrency=2
    dns:
      - 172.30.0.53 # CoreDNS DoT sidecar (bypasses UDP/53 hijack)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dns:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped
    networks: [backend, data]
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2'
        reservations:
          memory: 512M

  celery-beat:
    image: ghcr.io/ridwanpanji22/zf-core-v19/backend:latest
    build: ./backend
    command: celery -A app.services.celery_app beat --loglevel=info
    dns:
      - 172.30.0.53 # CoreDNS DoT sidecar
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dns:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped
    networks: [backend, data]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  frontend:
    image: ghcr.io/ridwanpanji22/zf-core-v19/frontend:latest
    build: ./frontend
    ports:
      - "127.0.0.1:3001:3000" # Internal only — reverse proxy via OpenLiteSpeed (3000 used by nghttpx)
    env_file:
      - .env
    restart: unless-stopped
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  ws-proxy:
    build: ./ws-proxy
    ports:
      - "0.0.0.0:8443:8443" # Public — Cloudflare proxied via ws.zf.nexacore.my.id
    volumes:
      - ./certs:/etc/nginx/certs:ro # Cloudflare Origin Certificate
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M

  # DNS-over-TLS sidecar — bypasses ISP/Kominfo DNS hijack on UDP/53.
  # DoT (TCP/853 to 1.1.1.1:853 with SNI cloudflare-dns.com) is NOT hijacked
  # (verified 2026-07-15); plain UDP/53 to 1.1.1.1 IS hijacked → resolves
  # exchange domains to Kominfo block IPs (139.255.196.196 / lamanlabuh.aduankonten.id).
  # cloudflared proxy-dns was removed in cloudflared 2026.2.0, so we use CoreDNS
  # with the `forward` plugin over TLS. Empirically verified end-to-end:
  # www.okx.com → 104.18.43.174 / 172.64.144.82 (real Cloudflare, not block IP).
  # Static IP so `dns:` directives below can reference it deterministically.
  dns:
    image: coredns/coredns:latest
    volumes:
      - ./dns/Corefile:/Corefile:ro
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.30.0.53
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
    # CoreDNS official image is distroless (no shell/wget/curl), so no CMD
    # healthcheck is possible. CoreDNS starts in ~1s and is very stable;
    # dependents use condition: service_started (see backend/celery-*).

  db:
    image: timescale/timescaledb:2.17.2-pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: zfcore
      POSTGRES_USER: zfcore
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # ports:  # Uncomment for local debugging only
    #   - "127.0.0.1:5432:5432"
    restart: unless-stopped
    networks: [data]
    shm_size: '1gb' # Shared memory increased to prevent OOM on aggregator joins
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zfcore -d zfcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    # ports:  # Uncomment for local debugging only
    #   - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks: [data]
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:   # frontend <-> backend only
  backend:    # backend <-> celery <-> data + cloudflared DoT sidecar
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:       # db + redis (internal only)

volumes:
  pgdata:
  redisdata:
